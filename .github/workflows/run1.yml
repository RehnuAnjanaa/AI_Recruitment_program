name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install requirements (none in this repo)
        run: |
          python -m pip install --upgrade pip

      - name: Run main.py (piped input)
        run: |
          echo "I have experience in Python, TensorFlow and Machine Learning" | python main.py
